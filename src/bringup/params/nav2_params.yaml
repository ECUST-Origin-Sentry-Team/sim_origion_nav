#       max_vel: 2.2                 # 最大速度 (m/s)
#       max_acc: 3.0                 # 最大加速度 (m/s²)
#       safe_distance: 0.05          # 实际 footprint 外的额外安全裕量 (m)
#       optimization_clearance_margin: 0.02 # 优化目标比最终硬净空多留2cm
#       center_clearance_tolerance: 0.005 # ESDF栅格插值容差；真实footprint仍硬检查
#       # 当前实车位置是不可优化的固定起点。仅当真实 footprint 无碰撞时，
#       # 允许从有限的额外净空缺口中驶出，并要求很快恢复完整安全裕量。
