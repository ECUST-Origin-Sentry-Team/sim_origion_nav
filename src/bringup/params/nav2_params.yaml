bt_navigator_navigate_through_poses_rclcpp_node:
  ros__parameters:
    use_sim_time: True

bt_navigator_navigate_to_pose_rclcpp_node:
  ros__parameters:
    use_sim_time: True

recoveries_server:
  ros__parameters:
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    recovery_plugins: ["escape","backup"]
    # spin:
    #   plugin: "nav2_recoveries/Spin"
    backup:
      plugin: "nav2_recoveries/BackUp"
    escape:
      plugin: "nav2_recoveries/Escape"
    # wait:
    #   plugin: "nav2_recoveries/Wait"
    global_frame: odom
    robot_base_frame: base_link_fake
    transform_timeout: 0.1
    simulate_ahead_time: 5.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

controller_server:
  ros__parameters:
    use_sim_time: True
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"] # "precise_goal_checker"
    controller_plugins: ["FollowPath"]
    speed_limit_topic: "/speed_limit"
    # Progress checker parameters
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 60.0
    # Goal checker parameters
    # precise_goal_checker:
    #  plugin: "nav2_controller::SimpleGoalChecker"
    #  xy_goal_tolerance: 0.25
    #  yaw_goal_tolerance: 0.25
    #  stateful: True
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.14

    # FollowPath:
    #   plugin: "hero_mpc_controller::HeroMpcController"
    #   max_velocity: 2.2
    #   max_omega: 1.5
    #   max_acceleration: 3.0
    #   max_alpha: 1.0
    #   # MPC 输出为加速度、底盘接口为速度。保留上一帧速度命令才能跨
    #   # 20 Hz 控制周期正常加速；同时限制其与实测里程计的最大偏差。
    #   max_command_tracking_error: 0.6
    #   command_state_timeout: 0.2
    #   enable_yaw_tracking: false
    #   reference_yaw: 0.0
    #   weight_q: [800.0, 800.0, 20.0, 100.0, 100.0, 5.0]
    #   weight_r: [1.0, 1.0, 0.5]
    #   carrot_point_index: 8
    #   trajectory_timeout: 1.0
    #   trajectory_topic: "smoother_server/minco_polynomial_trajectory"
    #   collision_check_enabled: true
    #   collision_check_horizon: 0.8
    #   collision_cost_threshold: 254
    #   trajectory_path_match_tolerance: 0.05
    #   trajectory_path_stamp_tolerance: 0.01
    #   # 全局路径仍按 1 Hz 更新，但同一目标的新 MINCO 轨迹至少等待
    #   # 当前轨迹执行 3 s，避免每秒把轨迹相位重新置为 t=0。
    #   minimum_trajectory_execution_time: 3.0

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 56
      model_dt: 0.06 # 预测时间：0.05*56=2.8s
      
      batch_size: 2000
      vx_std: 0.5 #0.2
      vy_std: 0.5 #0.2
      wz_std: 0.1 #0.4
      vx_max: 3.0 #0.5 预测距离：2.8*1.5=8.4m local_costmap的大小至少为8.4*8.4
      vx_min: -3.0 #-0.35
      vy_max: 3.0 #0.5
      wz_max: 0.1 #1.9
      ax_max: 20.0
      ay_max: 20.0
      ax_min: -20.0
      ay_min: -20.0
      iteration_count: 1
      prune_distance: 8.5 #1.7 需大于等于8.4m
      transform_tolerance: 0.1
      temperature: 0.3
      gamma: 0.015
      motion_model: "Omni"
      visualize: true
      publish_optimal_trajectory : true
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      TrajectoryValidator:
        plugin: "mppi::DefaultOptimalTrajectoryValidator"
        collision_lookahead_time: 2.0
        consider_footprint: false
      critics: ["ObstaclesCritic", "GoalCritic", "PathAlignCritic", "PathFollowCritic", "TwirlingCritic"]
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 2.8 #1.0 prediction horizon
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 0.1 #default: 1.5 和costmap配合避障，越大避障越强
        critical_weight: 20.0
        consider_footprint: false
        collision_cost: 50.0
        collision_margin_distance: 0.11 #多少米以内算危险区域
        near_goal_distance: 0.5
        inflation_radius: 0.55 # (only in Humble)
        cost_scaling_factor: 5.0 #10.0 # (only in Humble)
        inflation_layer_name: "inflation_layer" # local_costmap的layer name
      PathAlignCritic:
        enabled: true
        cost_power: 2   #1  改大转弯变好？
        cost_weight: 8.0 #14.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 2
        threshold_to_consider: 0.40
        offset_from_furthest: 25 #20 4.2m / 0.05(resolution) * 0.3 = 25.2
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 25 #5
        threshold_to_consider: 2.8 #0.6 prediction horizon
      TwirlingCritic:
        enabled: true
        twirling_cost_power: 1
        twirling_cost_weight: 10.0

dog_map_node:
    ros__parameters:
      use_sim_time: true
      cloud_topic: "/livox/lidar/pointcloud"
      target_frame: "map"
      base_frame: "base_link_fake"
      transform_timeout: 0.2
      transform_queue_size: 30
      half_map_size: 10.0 #以车为中心的局部地图,也就是点云分析范围
      resolution_z: 0.01 #z方向分辨率,用于高层分析
      # 仿真 URDF: base_link -> chassis z=-0.6 m，车轮半径约 0.0758 m
      ground_z_in_base: -0.676
      min_obstacle_height: 0.091 #局部地面以上的最小障碍高度
      max_obstacle_height: 0.7 #最高点云高度,高于此数值的过滤
      min_obstacle_column_height: 0.06 #过滤低于6cm的竖向噪声
      frame_save: 3 # 地图记忆帧数
      LOG_OCC_HIT_mid360: 34
      LOG_OCC_FREE: -20
      THR_OCC: 30
      MAX_LOG_MID360: 34
      MIN_LOG: 5
      map_yaml_path: "/home/hexinyi/sim/sim_origion_nav/src/bringup/map/rmuc_2025_normalized.yaml"

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 20.0
      publish_frequency: 10.0
      global_frame: odom
      robot_base_frame: base_link_fake
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.025
      robot_radius: 0.17
      plugins: ["static_layer","fast_layer", "inflation_layer"]
      fast_layer:
        plugin: fast_layer::FastLayer
        pointcloud_topic: /rog_map/inf_occ
        pointcloud_timeout: 0.5
        transform_timeout: 0.1
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 2.5
        inflation_radius: 0.40
      always_send_full_costmap: true

