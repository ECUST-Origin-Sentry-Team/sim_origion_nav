map_server:
  ros__parameters :
    use_sim_time: True
    # Overridden in launch by the "map" launch configuration or provided default value.
    # To use in yaml, remove the default "map" value in the tb3_simulation_launch.py file & provide full path to map below.
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0 #20.0
    use_sim_time: True
    # planner_plugins: ["GridBased"]
    # GridBased:
    #   plugin: "nav2_navfn_planner/NavfnPlanner"
    #   tolerance: 0.2
    #   use_astar: false
    #   allow_unknown: true
    #   use_final_approach_orientation: true

    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "topology_global_planner::TopologyGlobalPlanner"
      topology_yaml: "/home/hexinyi/sim/sim_origion_nav/src/navigation/topology_global_planner/config/topo.yaml"
      use_topology: true
      fallback_to_inner_planner: false
      allow_nearest_region_fallback: false
      region_boundary_tolerance: 0.03
      transform_tolerance: 0.1
      duplicate_pose_tolerance: 0.02
      max_nearest_region_distance: 1.0   # only used when allow_nearest_region_fallback=true
      enforce_region_constraint: true
      region_constraint_tolerance: 0.15   # meters; allow small boundary/portal tolerance
      # Inner planner = your original global planner.
      inner_planner_name: "InnerPlanner"
      inner_planner_plugin: "nav2_navfn_planner/NavfnPlanner"

    InnerPlanner:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true
      use_final_approach_orientation: true

smoother_server:
  ros__parameters:
    use_sim_time: True
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

