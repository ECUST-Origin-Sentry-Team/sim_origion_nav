global_costmap:
  global_costmap:
    ros__parameters:
      transform_tolerance: 1.0
      use_sim_time: true
      update_frequency: 10.0 # 5->10
      publish_frequency: 5.0 # 2->6
      global_frame: map
      robot_base_frame: base_link_fake
      robot_radius: 0.17
      resolution: 0.05
      track_unknown_space: true
      #plugins: ["static_layer", "simulated_obstacle_layer", "inflation_layer"]
      plugins: ["static_layer","inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
        track_unknown_space: True
        map_topic: /map
      simulated_obstacle_layer:
        plugin: "simulated_obstacle_layer::SimulatedObstacleLayer"
        enabled: true
        center_topic: /simulated_obstacle/center
        enabled_topic: /simulated_obstacle/enabled
        radius: 0.40 # 与局部层保持一致
        cost: 254
        transform_tolerance: 0.10
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 5.0
        inflation_radius: 0.5
      always_send_full_costmap: true
